[package]
name = "gpp_utils"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1"
rand = "0.8"
rand_mt = "4.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
ctrlc = "3"
fs2 = "0.4"
tempfile = "3"

[[bin]]
name = "gpp"
path = "src/bin/gpp/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
