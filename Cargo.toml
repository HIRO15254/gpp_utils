[package]
name = "gpp_utils"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
rand_mt = "4.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.31"
egui_plot = "0.31"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"

# 実験・ベンチは release で実行する前提の最適化設定。
# lto + 単一 codegen-unit でクレート横断のインライン化を効かせる。
[profile.release]
lto = "fat"
codegen-units = 1
